@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150b0c; --surface:#211314; --surface2:#2d1a1b; --fg:#F2EDD9; --muted:#bba99c; --line:#3e2627;
  --accent:#e2575a; --accent-fg:#1a0a0b; --accent-soft:#3b1a1c;
  --yolk:#E7B13A; --yolk-soft:#3a2b0f; --yolk-fg:#f6dc9a;
  --ok:#5cc184; --ok-soft:#16301f; --warn:#e4aa47; --warn-soft:#3a2b10; --bad:#f07a55; --bad-soft:#3f1b12; --info:#78ace6; --info-soft:#15263b;
  --brand-red:#AC1F23; --brand-deep:#7A1318; --brand-wine:#4a1016; --brand-cream:#F2EDD9;
  --shadow:0 10px 30px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150b0c; --surface:#211314; --surface2:#2d1a1b; --fg:#F2EDD9; --muted:#bba99c; --line:#3e2627;
  --accent:#e2575a; --accent-fg:#1a0a0b; --accent-soft:#3b1a1c;
  --yolk:#E7B13A; --yolk-soft:#3a2b0f; --yolk-fg:#f6dc9a;
  --ok:#5cc184; --ok-soft:#16301f; --warn:#e4aa47; --warn-soft:#3a2b10; --bad:#f07a55; --bad-soft:#3f1b12; --info:#78ace6; --info-soft:#15263b;
  --brand-red:#AC1F23; --brand-deep:#7A1318; --brand-wine:#4a1016; --brand-cream:#F2EDD9;
  --shadow:0 10px 30px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-deep)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.15rem} h2{font-size:1.1rem} h3{font-size:.98rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(115deg,var(--brand-red),var(--brand-deep) 70%,var(--brand-wine));color:var(--brand-cream);overflow:hidden}
header.top::after{content:"";position:absolute;inset-inline-end:max(10px,env(safe-area-inset-left,0px));top:-30px;width:46px;height:180px;background:var(--brand-cream);-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat;opacity:.09;pointer-events:none}
header.top .wrap{position:relative;z-index:1}
.brandlogo{width:104px;height:56px;flex:none;background:var(--brand-cream);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.redlogo{width:180px;height:97px;background:var(--brand-red);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
:root[data-theme="dark"] .redlogo{background:var(--brand-cream)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .redlogo{background:var(--brand-cream)}}
.slogan{font-family:var(--f-display);color:var(--accent);font-weight:700;font-size:1.05rem}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:34px;height:34px;flex:none}
.brand{display:flex;flex-direction:column;min-width:0}
.brand small{color:color-mix(in srgb,var(--brand-cream) 75%,transparent);font-size:.78rem}
.brand h1{color:var(--brand-cream);font-size:1.05rem}
.brand{border-inline-start:1px solid color-mix(in srgb,var(--brand-cream) 30%,transparent);padding-inline-start:12px}
.me .pill{background:rgba(255,255,255,.14)!important;color:var(--brand-cream)!important}
.me{margin-inline-start:auto;display:flex;align-items:center;gap:8px;min-width:0}
.me .btn{background:transparent;color:var(--brand-cream);border-color:color-mix(in srgb,var(--brand-cream) 45%,transparent)}
.me .btn:hover{background:rgba(255,255,255,.12)}
.me .btn.yolk{background:var(--yolk);color:#2b1d00;border-color:var(--yolk)}
.me b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:color-mix(in srgb,var(--brand-cream) 82%,transparent);padding:6px 12px;border-radius:999px;font-weight:500;font-size:.92rem;white-space:nowrap}
nav.tabs a:hover{background:rgba(255,255,255,.1);color:var(--brand-cream)}
nav.tabs a.on{background:var(--brand-cream);color:var(--brand-red);font-weight:700}
nav.tabs a .dot{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:6px;border-radius:9px;background:var(--yolk);color:#3a2500;font-size:.72rem;line-height:18px;text-align:center}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{padding:0;overflow:hidden}
.card h2 .sub,.card h3 .sub{color:var(--muted);font-weight:400;font-size:.85rem;margin-inline-start:6px}
.muted{color:var(--muted)} .small{font-size:.84rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.yolk{background:var(--yolk);border-color:var(--yolk);color:#2b1d00}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:.82rem;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;line-height:1.7}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)} .t-muted{background:var(--surface2);color:var(--muted)} .t-yolk{background:var(--yolk-soft);color:var(--yolk-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.86rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.chip.on.badc{background:var(--bad-soft);border-color:var(--bad)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.82rem;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px}
.fld textarea{min-height:80px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters.card{flex-direction:row}
.filters .fld{flex:1 1 150px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
td.n,th.n{text-align:end}
.qty td{padding:5px 6px} .qty input{width:74px;min-height:36px;padding:5px 6px;text-align:center;border:1px solid var(--line);border-radius:7px;background:var(--bg)}

const DAY_RE=/الأحد|الاثنين|الثلاثاء|الأربعاء|الخميس|الجمعة|السبت/g;
function urIn(s){if(UR[s]!=null)return UR[s];for(const[re,f]of URX){const m=s.match(re);if(m)return f(m)}const t=s.replace(DAY_RE,d=>DAY_UR[d]);return t!==s?t:null}
function urStr(s){
  if(!s||!/[ء-ي]/.test(s))return null;
  const m=s.match(/^([\s·:،✦*\-–]*)([\s\S]*?)([\s·:،*\-–]*)$/);if(!m||!m[2])return null;
  const t=urIn(m[2]);return t==null?null:m[1]+t+m[3];
}
const TR_ATTRS=['placeholder','aria-label','title','label'];
function trOne(n){
  if(n.nodeType===3){const p=n.parentNode;if(!p||(p.closest&&p.closest('[data-notr],textarea,script,style')))return;
    const t=urStr(n.data);if(t!=null&&t!==n.data){if(p.tagName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',p.textContent);n.data=t}}
  else if(n.nodeType===1){if(n.closest('[data-notr]'))return;
    for(const a of TR_ATTRS){const v=n.getAttribute(a);if(v){const t=urStr(v);if(t!=null&&t!==v)n.setAttribute(a,t)}}}
}
function trTree(root){trOne(root);if(root.nodeType!==1)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);let x;while((x=w.nextNode()))trOne(x)}
function startUrdu(){
  if(LANG!=='ur')return;
  trTree(document.body);
  new MutationObserver(list=>{for(const r of list){if(r.type==='childList')r.addedNodes.forEach(trTree);else trOne(r.target)}})
    .observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:TR_ATTRS});
}

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const M=1600;const k=Math.min(1,M/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.74));
  }catch(e){return file}
}

function applyAI(v,a){
  const n=clone2(v);const ids=new Set(products().map(p=>p.id));const empty=x=>x===undefined||x===null||x==='';let c=0;
  n.shelf=n.shelf||{};n.prices=n.prices||{};n.oos=n.oos||[];n.face=n.face||{};
  for(const p of a.products||[]){if(!ids.has(p.id))continue;
    if(p.cartons!=null&&empty(n.shelf[p.id])){n.shelf[p.id]=+p.cartons;c++}
    if(p.price!=null&&+p.price>0&&empty(n.prices[p.id])){n.prices[p.id]=+p.price;c++}
    if(p.oos&&!n.oos.includes(p.id)){n.oos.push(p.id);c++}}
  if(a.sharePct!=null&&empty(n.share)){n.share=String(Math.round(a.sharePct));c++}
  if(a.expiry&&/^\d{4}-\d\d-\d\d$/.test(a.expiry)&&empty(n.expiry)){n.expiry=a.expiry;c++}
  const it=L('issueTypes');let iss=(a.issues||[]).filter(x=>it.includes(x));
  if((a.products||[]).some(p=>p.damaged)&&it.includes('كسر أو تلف'))iss.push('كسر أو تلف');
  for(const x of iss)if(!(n.issues||[]).includes(x)){n.issues=[...(n.issues||[]),x];c++}
  if(a.promo&&a.promo.active&&!n.promo.active){n.promo={...n.promo,active:true,type:L('promoTypes').includes(a.promo.type)?a.promo.type:'',price:a.promo.price??'',note:a.promo.note||''};c++}
  const have=new Set((n.comp||[]).map(x=>(x.brand+'|'+x.desc).trim()));
  for(const x of a.competitors||[]){const k=((x.brand||'')+'|'+(x.desc||'')).trim();if(have.has(k)||!x.brand)continue;have.add(k);
    n.comp=[...(n.comp||[]),{id:rid(),brand:x.brand,vs:ids.has(x.vs)?x.vs:'',desc:x.desc||'',price:x.price??'',promo:!!x.promo,promoPrice:x.promoPrice??'',ai:true}];c++}

/* ---------------- alerts ---------------- */
function buildAlerts(date){
  const out=[];const br=scopeBranches().filter(b=>b.active!==false&&!b.demo);const ids=new Set(br.map(b=>b.id));
  const last={},oosN={},low=[];const w7=addDays(date,-7),w3=addDays(date,-3);
  for(const r of S.reports){if(r.demo||r.date>date)continue;for(const v of r.visits||[]){if(!ids.has(v.branchId))continue;
    if(!last[v.branchId]||last[v.branchId]<r.date)last[v.branchId]=r.date;
    if(r.date>w7&&(v.oos||[]).length)oosN[v.branchId]=(oosN[v.branchId]||0)+1;
    if(r.date>w3&&v.ai&&v.ai.score!=null&&v.ai.score<50)low.push({v,r})}}
  for(const b of br){if(!b.merchUid||!(b.visitDays||[]).length)continue;
    if(!last[b.id])out.push({tone:'bad',t:'لا توجد زيارة مسجلة في آخر شهر',b:b.id});
    else if(last[b.id]<=w7)out.push({tone:'bad',t:'آخر زيارة '+fmtDate(last[b.id]),b:b.id})}
  for(const[b,n]of Object.entries(oosN))if(n>=2)out.push({tone:'bad',t:'نفاد متكرر: '+n+' زيارات خلال أسبوع',b});
  for(const p of S.pos){if(!ids.has(p.branchId))continue;
    if(p.deliveryDate<date&&['new','approved','loading','onroute'].includes(p.status||'new'))out.push({tone:'warn',t:'طلب '+(p.number||'')+' متأخر عن موعد التوريد '+fmtDate(p.deliveryDate),b:p.branchId});
    if(p.status==='partial'&&p.deliveryDate>w7)out.push({tone:'warn',t:'نقص توريد في طلب '+(p.number||'')+': '+num(sum(p.items)-sum(p.received))+' كرتون',b:p.branchId})}
  for(const{v,r}of low)out.push({tone:'warn',t:'تقييم رف منخفض '+Math.round(v.ai.score)+'/100 ('+fmtDate(r.date)+')',b:v.branchId});
  if(date===today()&&new Date().getHours()>=11){const wd=weekday(date);
    for(const u of teamScope()){const pl=br.filter(b=>b.merchUid===u&&(b.visitDays||[]).includes(wd));if(pl.length&&!S.reports.some(r=>r.uid===u&&r.date===date&&!r.demo))out.push({tone:'warn',t:nameOf(u)+' ما سجل أي زيارة اليوم ('+pl.length+' فروع مجدولة)',u})}}
  if(date===today()){const h=HR();const g=+h.grace||0;const now=mins(timeNow());
    for(const u of teamScope()){const r=S.reports.find(x=>x.uid===u&&x.date===date&&!x.demo);const rv=revOf(u,date);if(rv&&rv.excused)continue;const st=shiftStat(r);
      if(!(r&&r.shiftIn)){if(h.workDays.includes(weekday(date))&&now>mins(h.shiftStart)+g)out.push({tone:'bad',t:nameOf(u)+' ما سجل بداية الدوام بصورته',u})}
      else if(st.isLate)out.push({tone:'warn',t:nameOf(u)+' تأخر '+st.late+' دقيقة عن بداية الدوام',u});
      if(rv&&rv.uniform&&!rv.uniform.ok)out.push({tone:'warn',t:nameOf(u)+': مخالفة اللبس الرسمي',u})}}
  const rank={bad:0,warn:1};return out.sort((a,b)=>rank[a.tone]-rank[b.tone]);
}

/* ---------------- team performance ---------------- */
function Perf(){
  const s=useS();const[f,setF]=useRangeFilters();const[sort,setSort]=useState('comp');
  const days=[];for(let d=f.from;d<=f.to&&days.length<93;d=addDays(d,1))days.push(d);
  const rows=teamScope().filter(u=>!f.merch||u===f.merch).map(u=>{
    const br=s.branches.filter(b=>b.merchUid===u&&b.active!==false&&(!f.region||b.regionId===f.region));
    const rs=s.reports.filter(r=>r.uid===u&&!r.demo&&r.date>=f.from&&r.date<=f.to);const by={};rs.forEach(r=>by[r.date]=r);
    let planned=0,doneP=0,work=0;
    for(const d of days){const pl=br.filter(b=>(b.visitDays||[]).includes(weekday(d)));if(pl.length)work++;planned+=pl.length;const r=by[d];if(r){const vb=new Set(r.visits.map(v=>v.branchId));doneP+=pl.filter(b=>vb.has(b.id)).length}}
    const vs=rs.flatMap(r=>r.visits);const sc=vs.map(v=>v.ai&&v.ai.score).filter(x=>x!=null);const ds=vs.map(dur).filter(x=>x!=null);
    return{u,visits:vs.length,planned,doneP,comp:planned?doneP/planned*100:null,sent:rs.filter(r=>r.status==='submitted').length,work,score:sc.length?avg(sc):null,dur:ds.length?avg(ds):null,
      photo:vs.length?vs.filter(v=>(v.before||[]).length&&(v.after||[]).length).length/vs.length*100:null,issues:vs.filter(v=>(v.issues||[]).length).length,oos:vs.reduce((a,v)=>a+(v.oos||[]).length,0)};
  }).sort((a,b)=>(b[sort]??-1)-(a[sort]??-1));
  const P=(x)=>x==null?'—':Math.round(x)+'%';
  const tone=x=>x==null?'':x>=90?'var(--ok)':x>=70?'var(--warn)':'var(--bad)';
  const H=(k,l)=>html`<th class="n"><button type="button" class=${'sortb'+(sort===k?' on':'')} onClick=${()=>setSort(k)}>${l}</button></th>`;

${JSON.stringify(ctx).slice(0,60000)}
اكتب ملخصاً تنفيذياً بالعربية للمدير، مختصراً وعملياً، بهذه الأقسام بعناوين قصيرة:

3) ملاحظات الأسعار والمنافسين إن وجدت.

لا تختلق أرقاماً غير موجودة في البيانات. نص عادي بدون Markdown ثقيل.`,{modelTier:'default',onText:({text})=>setT(text)});setT(r.text)}
    catch(e){setErr(AI_ERR[e&&e.code]||'تعذّر إنشاء الملخص، أعد المحاولة.');if(e&&e.text)setT(e.text)}setBusy(false)};
  return html`<div class="ai">
    <div class="row between"><span class="ai-tag">✦ ملخص اليوم بالذكاء الاصطناعي</span><button class="btn sm ai-btn" disabled=${busy} onClick=${run}>${busy?html`<span class="spin"></span> يكتب…`:t?'أعد الكتابة':'اكتب الملخص'}</button></div>

  const normPhone=s=>{let d=digits(s);if(d.startsWith('00966'))d=d.slice(5);else if(d.startsWith('966'))d=d.slice(3);if(d.length===9&&d[0]==='5')d='0'+d;return d};

    <div class="fgrid"><${Fld} label="الرقم الوظيفي *"><input id="r-emp" class=${cls('empNo')} dir="ltr" value=${f.empNo} onInput=${e=>setF({...f,empNo:e.target.value})} required/><//>

function TripSheet({trip,isNew,onClose}){
  const[t,setT]=useState(()=>clone2(trip));const[busy,setBusy]=useState(false);const id=trip.id||rid();const[add,setAdd]=useState('');
  const pick=tid=>{const tr=truckOf(tid)||{};setT({...t,truckId:tid,driver:t.driver||tr.driver||'',phone:t.phone||tr.phone||''})};
  const move=(i,d)=>{const a=[...t.stops];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];setT({...t,stops:a})};
  const datePos=S.pos.filter(p=>p.deliveryDate===t.date);
  const addStop=()=>{if(!add)return;setT({...t,stops:[...t.stops,{branchId:add,eta:'',status:'pending'}]});setAdd('')};
  const addFromPOs=()=>{const have=new Set(t.stops.map(x=>x.branchId));const nb=[...new Set(datePos.filter(p=>!p.tripId||p.tripId===id).map(p=>p.branchId))].filter(b=>!have.has(b));setT({...t,stops:[...t.stops,...nb.map(b=>({branchId:b,eta:'',status:'pending'}))]})};
  async function save(){if(!t.truckId)return toast('اختر الشاحنة','bad');setBusy(true);
    try{await W(()=>put('trips/'+id,{...t,id:undefined,updatedAt:Date.now(),createdBy:t.createdBy||S.uid}),'تم حفظ الرحلة');
      // link POs of these stops on this date to the trip, and move them along with the trip status
      const map={loading:'loading',onroute:'onroute'};const brs=new Set(t.stops.map(x=>x.branchId));
      for(const p of datePos.filter(p=>brs.has(p.branchId)&&(!p.tripId||p.tripId===id))){
        const patch={};if(p.tripId!==id)patch.tripId=id;if(map[t.status]&&['new','approved','loading'].includes(p.status||'new')&&p.status!==map[t.status])patch.status=map[t.status];
        if(Object.keys(patch).length)await S.db.doc('pos/'+p.id).update(patch).catch(()=>{});
      }

const csvCell=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=(head,rows)=>'﻿'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
async function saveFile(name,data){if(!S.downloads){toast('التنزيل غير متاح في هذا العرض','bad');return false}try{await S.downloads.save({filename:name,data});toast('تم تجهيز الملف');return true}catch(e){if(e&&e.code!=='declined')toast('تعذّر تنزيل الملف','bad');return false}}

      await saveFile('زيارات_'+r.from+'_'+r.to+'.csv',toCSV(head,rows))}
    if(kind==='prices'){const reps=await getRange('reports','date');const rows=reps.flatMap(rp=>rp.visits.flatMap(v=>(v.comp||[]).map(c=>[rp.date,branchName(v.branchId),nameOf(rp.uid),c.brand,c.desc,c.vs?prodName(c.vs):'',c.price,c.promo?'نعم':'',c.promoPrice,c.vs?(v.prices||{})[c.vs]??'':''])));
      await saveFile('أسعار_المنافسين_'+r.from+'_'+r.to+'.csv',toCSV(['التاريخ','الفرع','الموظف','المنافس','المنتج','يقابل منتجنا','سعر المنافس','عرض','سعر العرض','سعرنا في نفس الفرع'],rows))}
    if(kind==='pos'){const pos=await getRange('pos','deliveryDate');const rows=pos.map(p=>[p.number,branchName(p.branchId),p.orderDate,p.deliveryDate,(PO_ST[p.status]||[''])[0],...prods.map(x=>(p.items||{})[x.id]??''),...prods.map(x=>(p.received||{})[x.id]??''),sum(p.items),p.received?sum(p.received):'',p.recvNote||'',p.notes||'']);
      await saveFile('طلبات_الشراء_'+r.from+'_'+r.to+'.csv',toCSV(['رقم الطلب','الفرع','تاريخ الطلب','تاريخ التوريد','الحالة',...prods.map(x=>'مطلوب - '+x.name),...prods.map(x=>'مستلم - '+x.name),'إجمالي المطلوب','إجمالي المستلم','ملاحظة الاستلام','ملاحظات'],rows))}

    const ok=await saveFile('نسخة_احتياطية_القرية_'+today()+'.json',JSON.stringify(out));
    if(ok)await put('settings/backup',{lastAt:Date.now(),by:S.uid,counts}).catch(()=>{});
  }catch(e){console.error(e);toast(errMsg(e),'bad')}setBusy('')};
  const pick=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;

      toast('تم استرجاع '+done+' سجل');setFile(null)}catch(e){toast(errMsg(e)+' (تم '+done+' من '+total+')','bad')}setBusy('')};
  return html`<div class="card"><h2>النسخ الاحتياطي <span class="sub">احفظ نسخة من كل البيانات على جهازك</span></h2>
    <div class="small">${b?html`آخر نسخة: <b>${fmtTs(b.lastAt)}</b> بواسطة ${nameOf(b.by)} · ${num(Object.values(b.counts||{}).reduce((a,x)=>a+x,0))} سجل`:html`<span style="color:var(--bad)">ما فيه نسخة احتياطية للحين</span>`}</div>
    <div class="muted small">الملف فيه كل الفروع والتقارير والطلبات والرحلات والموظفين والإعدادات. الصور نفسها ما تدخل فيه (تبقى في مخزن الصور). احفظه في Google Drive أو OneDrive أو بريدك، وكرّرها كل أسبوع.</div>
    <div class="row">${busy?html`<span class="ai-run"><span class="spin"></span>${busy}</span>`:html`<button class="btn pri" onClick=${run}>تنزيل نسخة احتياطية الآن</button>
      <label class="btn">استرجاع من نسخة…<input type="file" accept=".json,application/json" style="display:none" onChange=${pick}/></label>`}</div>
    ${file&&!busy&&html`<div class="notice"><div><b>${file.name}</b> · ${file.at?file.at.slice(0,10):''}</div>
      <div class="small">${BACKUP_COLS.filter(c=>file.n[c]).map(c=>COL_AR[c]+' '+file.n[c]).join('، ')}</div>
      <div class="small">الاسترجاع يرجّع كل سجل في النسخة كما كان، ولا يحذف أي شيء أُضيف بعدها.</div>
      <div class="row" style="margin-top:6px"><${Confirm} cls="pri" label="استرجاع هذه النسخة" ask="متأكد؟ السجلات الموجودة في النسخة بتنكتب فوق الحالية." onYes=${restore}/><button class="btn sm ghost" onClick=${()=>setFile(null)}>إلغاء</button></div></div>`}

/* ---------------- attendance, official uniform & incentives ----------------
   The rep photographs themselves in the official uniform at the start and end of the shift (camera only).
   Time and location are taken by the phone automatically. Supervisors and the manager review the uniform
   in reviews/{date}_{uid}, and can mark a day as excused. Monthly points come from scoreFor(). */
const HRDEF={shiftStart:'07:00',shiftEnd:'15:00',grace:15,workDays:[6,0,1,2,3,4],requirePhotos:true,bonus:0,rules:[],challengePts:20,challengeReward:'',uniformPhotos:[],heroPhoto:'',
  uniform:['الزي الرسمي للقرية (القميص بشعار القرية) نظيف ومرتب','البنطلون الرسمي الداكن','البطاقة الوظيفية ظاهرة','حذاء مغلق مناسب للعمل الميداني','الهندام والنظافة الشخصية'],
  weights:{schedule:30,punctual:20,uniform:15,shelf:15,reports:20},
  tiers:[{min:90,name:'ممتاز',pct:100},{min:80,name:'جيد جداً',pct:75},{min:70,name:'جيد',pct:50},{min:0,name:'يحتاج تحسين',pct:0}]};
const CRIT=[['schedule','الالتزام بجدول الزيارات','الفروع المجدولة اللي تمت زيارتها في يومها'],
  ['punctual','الحضور والانضباط','صورة بداية الدوام قبل نهاية فترة السماح، وصورة نهاية الدوام بعد وقت الانصراف'],
  ['uniform','اللبس الرسمي','الأيام اللي اعتمد فيها المشرف لبسك مطابق للمعيار'],
  ['shelf','جودة الرف','متوسط تقييم صور الرف'],
  ['reports','اكتمال التقارير','إرسال تقرير اليوم، وصور قبل وبعد في كل زيارة']];
const VIOL_TYPES=['الغياب بدون عذر','التأخير عن بداية الدوام بعد فترة السماح','عدم تسجيل صورة بداية أو نهاية الدوام','الانصراف قبل نهاية الدوام','مخالفة معيار اللبس الرسمي','فرع مجدول لم تتم زيارته'];
function HR(){const h=S.hr||{};return{...HRDEF,...h,weights:{...HRDEF.weights,...(h.weights||{})},uniform:(h.uniform&&h.uniform.length)?h.uniform:HRDEF.uniform,
  tiers:(h.tiers&&h.tiers.length)?h.tiers:HRDEF.tiers,workDays:Array.isArray(h.workDays)?h.workDays:HRDEF.workDays,rules:h.rules||[]}}
const hmOf=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const revOf=(uid,d)=>S.reviews.find(x=>x.id===d+'_'+uid);
function shiftStat(r){const h=HR();const i=r&&r.shiftIn,o=r&&r.shiftOut;const g=+h.grace||0;
  const late=i?mins(i.hm)-mins(h.shiftStart):null;const early=o?mins(h.shiftEnd)-mins(o.hm):null;
  return{i,o,late,isLate:late!=null&&late>g,early,isEarly:early!=null&&early>g}}
const tierOf=n=>{if(n==null)return null;const t=[...HR().tiers].sort((a,b)=>b.min-a.min);return t.find(x=>n>=x.min)||t[t.length-1]};
const actionOf=n=>n>=5?['رفع للموارد البشرية','bad']:n>=3?['إنذار كتابي','warn']:n>=1?['تنبيه شفهي','yolk']:['لا يوجد','ok'];
const monthRange=m=>{const[y,mo]=m.split('-').map(Number);return[m+'-01',m+'-'+pad(new Date(y,mo,0).getDate())]};
const bonusOf=x=>{const b=+HR().bonus||0;return b&&x.tier?Math.round(b*x.tier.pct/100):0};
function scoreFor(uid,from,to,reports){
  const h=HR();const t0=today();const by={};reports.forEach(r=>{if(r.uid===uid&&!r.demo&&r.date>=from&&r.date<=to)by[r.date]=r});
  const br=S.branches.filter(b=>b.merchUid===uid&&b.active!==false);
  const x={work:0,past:0,onTime:0,late:0,lateMin:0,absent:0,noIn:0,noOut:0,early:0,uniOk:0,uniBad:0,uniPend:0,uniMiss:0,planned:0,doneP:0,sent:0,excused:0,viol:[]};
  const start=h.startDate||t0;
  for(let d=from<start?start:from;d<=to&&d<=t0;d=addDays(d,1)){
    const r=by[d];const rv=revOf(uid,d);const isT=d===t0;
    if(!(h.workDays.includes(weekday(d))||(r&&r.shiftIn)))continue;
    if(rv&&rv.excused){x.excused++;continue}
    if(isT&&!(r&&r.shiftIn))continue; // today still running
    x.work++;if(!isT)x.past++;
    const pl=br.filter(b=>(b.visitDays||[]).includes(weekday(d)));x.planned+=pl.length;
    if(!r||(!r.shiftIn&&!(r.visits||[]).length)){x.absent++;x.uniMiss++;x.viol.push({d,t:'غياب بدون عذر'});continue}
    const vb=new Set((r.visits||[]).map(v=>v.branchId));const dn=pl.filter(b=>vb.has(b.id)).length;x.doneP+=dn;
    if(!isT&&dn<pl.length)x.viol.push({d,t:'فروع مجدولة لم تُزر: '+(pl.length-dn)});
    const st=shiftStat(r);
    if(!r.shiftIn){x.noIn++;x.viol.push({d,t:'بدون صورة بداية الدوام'})}
    else if(st.isLate){x.late++;x.lateMin+=st.late;x.viol.push({d,t:'تأخير '+st.late+' دقيقة'})}
    if(!isT){if(!r.shiftOut){x.noOut++;x.viol.push({d,t:'بدون صورة نهاية الدوام'})}else if(st.isEarly){x.early++;x.viol.push({d,t:'انصراف مبكر '+st.early+' دقيقة'})}}
    if(r.shiftIn&&!st.isLate&&(isT||(r.shiftOut&&!st.isEarly)))x.onTime++;
    if(rv&&rv.uniform){if(rv.uniform.ok)x.uniOk++;else{x.uniBad++;x.viol.push({d,t:'مخالفة اللبس الرسمي'})}}
    else if(r.shiftIn&&r.shiftIn.photo)x.uniPend++;else x.uniMiss++;
    if(!isT&&r.status==='submitted')x.sent++;
  }
  const vs=Object.values(by).flatMap(r=>r.visits||[]);const sc=vs.map(v=>v.ai&&v.ai.score).filter(v=>v!=null);
  const photo=vs.length?vs.filter(v=>(v.before||[]).length&&(v.after||[]).length).length/vs.length*100:null;
  const uniN=x.uniOk+x.uniBad+x.uniMiss;const sent=x.past?x.sent/x.past*100:null;
  x.s={schedule:x.planned?x.doneP/x.planned*100:null,punctual:x.work?x.onTime/x.work*100:null,uniform:uniN?x.uniOk/uniN*100:null,
    shelf:sc.length?avg(sc):null,reports:sent==null?photo:photo==null?sent:(sent+photo)/2};
  let w=0,t=0;for(const[k]of CRIT){const v=x.s[k],wk=+h.weights[k]||0;if(v!=null&&wk>0){w+=wk;t+=wk*v}}
  x.total=w?t/w:null;x.tier=tierOf(x.total);x.violDays=new Set(x.viol.map(v=>v.d)).size;return x;
}

/* camera capture with time + location */
function getLoc(){return new Promise(res=>{if(!navigator.geolocation)return res({err:'unsupported'});
  try{navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),
    e=>res({err:e&&e.code===1?'denied':'unavailable'}),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}catch(e){res({err:'blocked'})}})}
const mapLink=l=>l&&l.lat!=null?'https://maps.google.com/?q='+l.lat+','+l.lng:null;
function ShiftBtn({label,onDone,cls}){
  const[busy,setBusy]=useState('');
  async function pick(e){const f=e.target.files[0];e.target.value='';if(!f)return;
    if(!S.assets){toast('رفع الصور غير متاح لحسابك','bad');return}
    const t=Date.now();const hm=timeNow();const fresh=!f.lastModified||Math.abs(t-f.lastModified)<15*60000;
    setBusy('جاري تحديد الموقع ورفع الصورة…');
    try{const locP=getLoc();const blob=await shrink(f);const up=await S.assets.upload(blob,{contentType:blob.type});blobCache.set(up.id,blob);const loc=await locP;
      await onDone({t,hm,photo:up.id,fresh,loc:loc.err?null:loc,locErr:loc.err||null})}
    catch(err){console.error(err);if(!(err&&err.code))toast('تعذّر رفع الصورة، أعد المحاولة','bad')}
    setBusy('')}
  return html`<label class=${'btn capbtn '+(cls||'pri')}><input type="file" accept="image/*" capture="user" disabled=${!!busy} onChange=${pick}/>${busy||label}</label>`;
}
function ShiftCell({s,kind,st}){

    ${s.photo&&html`<img class="selfie" src=${imgSrc(s.photo)} alt="صورة الدوام" onClick=${e=>{e.stopPropagation();S.lightbox=s.photo;bump()}}/>`}
    <div><b dir="ltr">${s.hm}</b> ${off?html`<${Pill} st=${[(kind==='in'?'متأخر ':'مبكر ')+n+' د','bad']}/>`:html`<${Pill} st=${['في الوقت','ok']}/>`}
      <div class="small">${ml?html`<a href=${ml} target="_blank" rel="noopener" onClick=${e=>e.stopPropagation()}>📍 الموقع</a>`:html`<span class="muted">بدون موقع</span>`}${s.fresh===false?html` · <span style="color:var(--bad)">الصورة ليست جديدة</span>`:''}</div></div></div>`;
}
function ShiftCard({rep,date,onShift}){
  const h=HR();const st=shiftStat(rep);const isT=date===today();const rv=revOf(rep.uid,date);
  return html`<div class="card"><div class="row between"><h2>الدوام واللبس الرسمي</h2>
      <span class="small muted"><span>الدوام</span> <b dir="ltr">${h.shiftStart} – ${h.shiftEnd}</b> · <span>سماح</span> <b>${h.grace}</b> <span>د</span></span></div>
    <div class="grid2">
      <div class="sec"><h3>بداية الدوام</h3>${rep.shiftIn?html`<${ShiftCell} s=${rep.shiftIn} kind="in" st=${st}/>`:isT?html`<div class="small muted">صورة لك باللبس الرسمي كامل من كاميرا الجوال. الوقت والموقع يُسجلون تلقائياً.</div><${ShiftBtn} label="📷 تسجيل بداية الدوام" onDone=${x=>onShift('shiftIn',x)}/>`:html`<span class="muted small">لم يُسجل</span>`}</div>
      <div class="sec"><h3>نهاية الدوام</h3>${rep.shiftOut?html`<${ShiftCell} s=${rep.shiftOut} kind="out" st=${st}/>`:isT&&rep.shiftIn?html`<div class="small muted">آخر شيء قبل إرسال التقرير: صورة ثانية باللبس الرسمي.</div><${ShiftBtn} cls="yolk" label="📷 تسجيل نهاية الدوام" onDone=${x=>onShift('shiftOut',x)}/>`:html`<span class="muted small">${isT?'بعد تسجيل بداية الدوام':'لم يُسجل'}</span>`}</div>

      ${rv.uniform&&html`<div class="small muted">آخر تقييم: ${nameOf(rv.uniform.by)} · ${fmtTs(rv.uniform.at)}</div>`}

function ScoreCard({x}){
  const h=HR();const P=v=>v==null?'—':Math.round(v)+'%';const b=bonusOf(x);const act=actionOf(x.violDays);
  const facts=[['أيام العمل',x.work],['في الوقت',x.onTime],['تأخير',x.late],['غياب',x.absent],['أعذار',x.excused],['لبس بانتظار المراجعة',x.uniPend]].filter((f,i)=>i<2||f[1]);

      <div class="chips">${x.tier&&html`<${Pill} st=${[x.tier.name,x.tier.pct>=75?'ok':x.tier.pct>0?'yolk':'bad']}/>`}${x.tier&&html`<${Pill} st=${['حافز '+x.tier.pct+'%','info']}/>`}${b>0&&html`<span class="pill t-ok">${num(b)} ريال</span>`}</div></div>
    ${CRIT.map(([k,l])=>html`<div><div class="row between small"><span><span>${l}</span> · <span class="muted">${(+h.weights[k]||0)+' نقطة'}</span></span><b>${P(x.s[k])}</b></div><${Bar} v=${x.s[k]||0} max=${100}/></div>`)}

    ${x.viol.length?html`<div class="stack" style="gap:6px"><div class="row small"><b>أيام فيها مخالفات</b> <b>${x.violDays}</b> · <span>الإجراء المقترح:</span> <${Pill} st=${act}/></div>

}

/* ---------- brand (chain) coverage ---------- */
function chainStats(from,to,reports,pos,branches){
  const br=(branches||scopeBranches()).filter(b=>b.active!==false&&!b.demo);const vis={},vc={};
  for(const r of reports){if(r.demo||r.date<from||r.date>to)continue;for(const v of r.visits||[]){vis[v.branchId]=1;vc[v.branchId]=(vc[v.branchId]||0)+1}}
  const m={};const bc={};
  for(const b of br){const c=b.chain||'بدون براند';bc[b.id]=c;const x=m[c]||(m[c]={chain:c,n:0,visited:0,visits:0,req:0,del:0});x.n++;if(vis[b.id])x.visited++;x.visits+=vc[b.id]||0}
  for(const p of pos){if(p.demo||p.deliveryDate<from||p.deliveryDate>to||['rejected','returned','pending'].includes(p.status))continue;const c=bc[p.branchId];if(!c)continue;const x=m[c];x.req+=sum(p.items);
    if(p.received&&Object.keys(p.received).length)x.del+=sum(p.received);else if(p.status==='delivered')x.del+=sum(p.items)}
  return Object.values(m).map(x=>({...x,cov:x.n?x.visited/x.n*100:0,fill:x.req?x.del/x.req*100:null})).sort((a,b)=>b.n-a.n);
}
const covTone=v=>v>=80?'ok':v>=50?'warn':'bad';
function periodRange(per){const t=today();return per==='day'?[t,t]:per==='week'?[addDays(t,-6),t]:[t.slice(0,8)+'01',t]}
function BrandCoverage(){
  const s=useS();const[per,setPer]=useState('week');const[from,to]=periodRange(per);
  useEffect(()=>widenRange(from),[from]);
  const rows=chainStats(from,to,s.reports,s.pos);
  const T=rows.reduce((a,x)=>({n:a.n+x.n,visited:a.visited+x.visited,visits:a.visits+x.visits,req:a.req+x.req,del:a.del+x.del}),{n:0,visited:0,visits:0,req:0,del:0});
  const tc=T.n?T.visited/T.n*100:0;
  return html`<div class="card"><div class="row between"><h2>البراندات ونسبة التغطية <span class="sub">${from===to?fmtDate(from):fmtDate(from)+' – '+fmtDate(to)}</span></h2>
      <div class="seg">${[['day','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر']].map(([k,l])=>html`<button type="button" class=${per===k?'on':''} onClick=${()=>setPer(k)}>${l}</button>`)}</div></div>
    <div class="btiles">${rows.map(x=>html`<div class=${'btile t-'+covTone(x.cov)}>
      <div class="row between"><b class="bname">${x.chain}</b><span class="bpct">${Math.round(x.cov)}%</span></div>
      <div class="bbar"><i style=${'width:'+Math.round(x.cov)+'%'}></i></div>
      <div class="bfacts"><span><b>${x.n}</b> فرع مسجل</span><span><b>${x.visited}</b> تمت زيارتها</span><span><b>${num(x.del)}</b> كرتون نزل${x.req?html` <span class="muted">من ${num(x.req)}</span>`:''}</span></div></div>`)}
      ${!rows.length&&html`<${Empty} t="ما فيه فروع مسجلة"/>`}</div>
    <div class="small muted">الإجمالي: ${T.visited} من ${T.n} فرع (${Math.round(tc)}%) · ${T.visits} زيارة · ${num(T.del)} كرتون نزل فعلياً من ${num(T.req)} مطلوب. التغطية = الفروع اللي تمت زيارتها مرة على الأقل في الفترة ÷ الفروع المسجلة للبراند.</div>
  </div>`;
}

  const urls=['https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js','https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'];let i=0;
  const next=()=>{if(i>=urls.length){xlP=null;return rej(new Error('load'))}const sc=document.createElement('script');sc.src=urls[i++];sc.onload=()=>window.ExcelJS?res(window.ExcelJS):next();sc.onerror=next;document.head.appendChild(sc)};next()}))}
function teamRows(from,to,reports,pw){
  const days=[];for(let d=from;d<=to&&days.length<93;d=addDays(d,1))days.push(d);
  return S.roles.filter(r=>r.approved&&(r.role||'merch')==='merch').map(r=>r.id).map(u=>{
    const br=S.branches.filter(b=>b.merchUid===u&&b.active!==false);const rs=reports.filter(r=>r.uid===u&&!r.demo&&r.date>=from&&r.date<=to);const by={};rs.forEach(r=>by[r.date]=r);
    let planned=0,done=0;for(const d of days){const pl=br.filter(b=>(b.visitDays||[]).includes(weekday(d)));planned+=pl.length;const r=by[d];if(r){const vb=new Set((r.visits||[]).map(v=>v.branchId));done+=pl.filter(b=>vb.has(b.id)).length}}
    const vs=rs.flatMap(r=>r.visits||[]);const sc=vs.map(v=>v.ai&&v.ai.score).filter(x=>x!=null);
    const pts=pw.filter(x=>x.uid===u&&!x.demo).reduce((a,x)=>a+(+x.points||0),0);
    return{u,code:codeOf(u),name:nameOf(u),branches:br.length,visits:vs.length,comp:planned?done/planned*100:null,sent:rs.filter(r=>r.status==='submitted').length,days:rs.length,
      score:sc.length?avg(sc):null,issues:vs.filter(v=>(v.issues||[]).length).length,oos:vs.reduce((a,v)=>a+(v.oos||[]).length,0),pts,wins:pw.filter(x=>x.uid===u&&!x.demo).length}}).sort((a,b)=>(b.comp??-1)-(a.comp??-1));
}
function ceoModel(from,to,reports,pos,pw,fus){
  const br=S.branches.filter(b=>b.active!==false&&!b.demo);const ids=new Set(br.map(b=>b.id));
  const reps=reports.filter(r=>!r.demo&&r.date>=from&&r.date<=to);const vs=reps.flatMap(r=>(r.visits||[]).filter(v=>ids.has(v.branchId)));
  const chains=chainStats(from,to,reps,pos,br);const team=teamRows(from,to,reps,pw);
  const visited=new Set(vs.map(v=>v.branchId)).size;
  const P=pos.filter(p=>!p.demo&&p.deliveryDate>=from&&p.deliveryDate<=to&&!['rejected','returned','pending'].includes(p.status));
  const req=P.reduce((a,p)=>a+sum(p.items),0);const del=P.reduce((a,p)=>a+(p.received&&Object.keys(p.received).length?sum(p.received):p.status==='delivered'?sum(p.items):0),0);
  const sc=vs.map(v=>v.ai&&v.ai.score).filter(x=>x!=null);
  const compAll=(()=>{const c=team.filter(x=>x.comp!=null);return c.length?avg(c.map(x=>x.comp)):null})();
  const it={};vs.forEach(v=>(v.issues||[]).forEach(i=>it[i]=(it[i]||0)+1));
  const ours={};products().forEach(p=>{const a=vs.map(v=>+(v.prices||{})[p.id]).filter(x=>x>0);ours[p.id]=a.length?avg(a):null});
  const lastPw={};pw.filter(x=>!x.demo&&x.date>=from&&x.date<=to).sort((a,b)=>(a.at||0)-(b.at||0)).forEach(x=>lastPw[x.chain]=x);
  const prices=Object.values(lastPw).flatMap(x=>(x.rows||[]).map(c=>{const o=c.vs?ours[c.vs]:null;return{chain:x.chain,date:x.date,code:codeOf(x.uid),competitor:c.brand,product:c.desc||'',vs:c.vs?prodName(c.vs):'',price:+c.price||null,promo:c.promo?(+c.promoPrice||'نعم'):'',ours:o,diff:o&&+c.price?(o-+c.price)/+c.price:null}}));
  const posBy=Object.entries(PO_ST).map(([k,s])=>{const a=pos.filter(p=>!p.demo&&p.deliveryDate>=from&&p.deliveryDate<=to&&(p.status||'new')===k);return[s[0],a.length,a.reduce((x,p)=>x+sum(p.items),0),a.reduce((x,p)=>x+sum(p.received),0)]}).filter(x=>x[1]);
  const openFu=vs.filter(v=>(v.issues||[]).length).length-fus.filter(f=>f.status==='closed'&&f.date>=from&&f.date<=to).length;
  return{from,to,brand:(S.settings&&S.settings.ourBrand)||'القرية',at:new Date().toLocaleString('en-GB'),
    kpis:[['الفروع النشطة',br.length,'n'],['فروع تمت زيارتها',visited,'n'],['نسبة التغطية',br.length?visited/br.length:0,'%'],['عدد الزيارات',vs.length,'n'],
      ['الالتزام بجدول الزيارات',compAll==null?null:compAll/100,'%'],['المناديب المعتمدين',team.length,'n'],['تقارير يومية مرسلة',reps.filter(r=>r.status==='submitted').length,'n'],
      ['زيارات فيها مشاكل',vs.filter(v=>(v.issues||[]).length).length,'n'],['مشاكل بدون إغلاق',Math.max(0,openFu),'n'],['حالات نفاد من الرف',vs.reduce((a,v)=>a+(v.oos||[]).length,0),'n'],
      ['متوسط تقييم الرف (AI)',sc.length?Math.round(avg(sc)):null,'n'],['طلبات الشراء',P.length,'n'],['كراتين مطلوبة',req,'n'],['كراتين نزلت فعلياً',del,'n'],['نسبة التنفيذ (منزل ÷ مطلوب)',req?del/req:null,'%'],
      ['قراءات أسعار المنافسين (براندات)',Object.keys(lastPw).length,'n']],
    chains,team,prices,issues:Object.entries(it).sort((a,b)=>b[1]-a[1]).slice(0,10),posBy};
}

async function ceoExport(from,to,setBusy){

  const TIPS={schedule:'ابدأ بالفروع البعيدة بدري، وسجّل كل زيارة وأنت داخل الفرع.',punctual:'صوّر بداية الدوام أول ما توصل أول فرع، قبل نهاية فترة السماح.',uniform:'راجع بنود اللبس تحت قبل ما تصوّر نفسك.',shelf:'رتّب الرف وقدّم الأقدم، وصوّر الرف كامل بإضاءة واضحة.',reports:'لا تنسى صور قبل وبعد، وأرسل التقرير بعد صورة نهاية الدوام.'};

/* ---------------- auto update ----------------
   APP_VERSION goes up with every publish. The manager's page records the newest version in
   settings/app; every open phone listens to that doc live and reloads itself onto the new copy. */
const APP_VERSION=14;
const newerVersion=()=>S.appInfo&&+S.appInfo.version>APP_VERSION?+S.appInfo.version:0;
function hardReload(){location.reload()}
function UpdateWatch(){
  const s=useS();const nv=newerVersion();
  useEffect(()=>{ // the manager's copy announces its version to everyone
    if(s.canEdit&&s.loaded.appInfo&&!(s.appInfo&&+s.appInfo.version>=APP_VERSION))put('settings/app',{version:APP_VERSION,at:Date.now(),by:S.uid}).catch(()=>{});
  },[s.canEdit,s.loaded.appInfo,s.appInfo&&s.appInfo.version]);
  useEffect(()=>{ // reload by itself once, when no visit form is open (drafts are kept on the phone anyway)
    if(!nv)return;let tried=null;try{tried=sessionStorage.getItem('upd')}catch(e){}
    if(tried===String(nv))return;
    const go=()=>{if(document.querySelector('.sheet'))return;try{sessionStorage.setItem('upd',String(nv))}catch(e){}hardReload()};
    const t=setTimeout(go,2500);const f=()=>{if(document.visibilityState==='visible')go()};document.addEventListener('visibilitychange',f);
    return()=>{clearTimeout(t);document.removeEventListener('visibilitychange',f)};
  },[nv]);
  if(!nv)return null;
  return html`<div class="updbar" role="status"><span>فيه تحديث جديد للتطبيق</span><button type="button" class="btn sm yolk" onClick=${hardReload}>حدّث الآن</button></div>`;
}
function Overlays(){
  const s=useS();
  return html`${s.db&&html`<${UpdateWatch}/>`}${s.db&&s.canEdit&&html`<${RegWatch}/>`}${s.db&&html`<${ChWatch}/>`}
    ${s.notifOpen&&html`<${NotifSheet} onClose=${()=>{S.notifOpen=false;bump()}}/>`}${s.ceoOpen&&html`<${CeoSheet} onClose=${()=>{S.ceoOpen=false;bump()}}/>`}${s.lightbox&&html`<div class="lightbox" onClick=${()=>{S.lightbox=null;bump()}}><img src=${imgSrc(s.lightbox)} alt="صورة الرف"/></div>`}
    ${s.toast&&html`<div class=${'toast '+(s.toast.tone||'')} role="status">${s.toast.msg}</div>`}`;
}
render(html`<${App}/>`,document.getElementById('app'));
startUrdu();
boot().catch(e=>{console.error(e);S.noDb=true;S.ready=true;bump()});
